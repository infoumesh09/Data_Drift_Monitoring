version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: driftsense-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-driftsense}
      POSTGRES_USER: ${POSTGRES_USER:-driftsense}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-driftsense_password}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-driftsense} -d ${POSTGRES_DB:-driftsense}"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - driftsense-network

volumes:
  postgres_data:

networks:
  driftsense-network:
    driver: bridge
